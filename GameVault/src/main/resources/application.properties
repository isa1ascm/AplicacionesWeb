# Configuración de puerto y nombre de aplicación
server.port=8080
spring.application.name=GameVault

# Conexión a MySQL (la base de datos se crea sola si no existe)
# Ajusta usuario y contraseña a los de tu MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/gamevaultdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Holapinto1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Tamaño máximo de las portadas (el formulario indica 2MB)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
