<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GameVault</title>
    <link rel="stylesheet" th:href="@{/styles/style.css}">
</head>
<body>
    <nav th:replace="~{base :: navbar}"></nav>

<main class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h2 class="text-gradient">Catálogo de Juegos</h2>
        <a href="/juegos/nuevo" class="btn btn-primary">+ Nuevo Juego</a>
    </div>

    <!-- BARRA DE BÚSQUEDA -->
    <div style="margin-bottom: 30px;">
        <form action="/juegos" method="get" style="display: flex; gap: 10px;">
            <input type="text" name="buscar"
                   th:value="${busquedaActual}" placeholder="Buscar juego por título..."
                   style="flex: 1; padding: 10px; border-radius: 5px; border: 1px solid var(--bg-panel); background: var(--bg-panel); color: white;">
            <button type="submit" class="btn btn-secondary">Buscar</button>
            <a th:if="${busquedaActual != null}" href="/juegos" class="btn btn-secondary" style="background: var(--bg-panel);">Limpiar</a>
        </form>
    </div>

    <p th:if="${#lists.isEmpty(juegos)}" style="color: var(--text-muted);">No hay juegos para mostrar.</p>

    <div class="grid">

        <div class="panel" style="padding: 0; overflow: hidden;" th:each="juego : ${juegos}">

            <img th:src="${juego.portada != null} ? @{${juego.portada}} : 'https://via.placeholder.com/300x400?text=Juego'"
                 alt="Portada"
                 style="width: 100%; height: 300px; object-fit: cover; display: block;" />

            <div style="padding: 20px;">
                <h3 style="margin-top: 0; margin-bottom: 10px;" th:text="${juego.titulo}">Título del Juego</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; margin: 0;" th:text="${juego.descripcion}">Descripción breve del juego.</p>
            </div>
        </div>

    </div>
</main>

</body>
</html>
